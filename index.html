<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00885a">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hũ Chi Tiêu">
<title>Hũ Chi Tiêu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--nen:#f2f7f5;--the:#fff;--chu:#17231f;--mo:#62726c;--vien:#e6efeb;
--c1:#00885a;--c2:#17bd85;--cam:#ff7a1a;--tim:#7c3aed;--lam:#2f80ed;
--vao:#00885a;--ra:#e8590c;--canh:#e69500;--qua:#e03131;
--bong:0 6px 20px rgba(0,80,55,.08);--nhanh:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--nen);color:var(--chu);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;transition:transform .14s var(--nhanh)}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:2px solid var(--tim);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:14px 14px 0}

/* Dau trang */
header{position:sticky;top:0;z-index:5;background:var(--c1);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 10px 8px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(0,100,70,.2)}
body[data-tab=tq] header{border-radius:0;box-shadow:none}
.dauthang{max-width:540px;margin:0 auto;display:flex;align-items:center}
.dauthang h1{flex:1;margin:0;font-size:18px;font-weight:700;text-align:center}
.tron{width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;display:grid;place-items:center}
#dongbo{display:block;width:100%;max-width:540px;margin:0 auto;font-size:12.5px;color:#e4fff4;text-align:center;min-height:18px}
#dongbo.loi{color:#fff3c4;font-weight:600}

/* The so du */
.hero{margin:-14px -14px 0;padding:6px 18px 46px;background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;border-radius:0 0 28px 28px}
.hieuung .hero{animation:none}
.chao{font-size:14px;opacity:.95}
.dongso{display:flex;align-items:center;gap:6px;margin-top:2px}
.solon{font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.mat{width:44px;height:44px;flex:none;display:grid;place-items:center;color:#fff}
.mat svg{width:24px;height:24px}
.phu2{font-size:13px;opacity:.95}
.cap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cap div{background:rgba(255,255,255,.2);border-radius:14px;padding:9px 12px;font-size:12.5px}
.cap b{display:block;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* O thao tac nhanh */
.nhanhbon{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);background:var(--the);border-radius:18px;margin:-32px 0 14px;padding:12px 4px;box-shadow:var(--bong)}
.nhanhbon button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:550;min-height:64px}
.nhanhbon span{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--n);color:var(--m)}
.nhanhbon svg{width:23px;height:23px}

.the{background:var(--the);border-radius:18px;padding:15px;margin:0 0 14px;box-shadow:var(--bong)}
.the h2{margin:0 0 12px;font-size:15.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.the h2 button,.the h2 small{font-size:13px;font-weight:600;color:var(--c1)}
.the h2 small{color:var(--mo)}
.nhan{font-size:13px;color:var(--mo)}
.am{color:var(--qua)}
.vao{color:var(--vao)}.ra{color:var(--ra)}

/* Nhip chi tieu */
.nhip{display:grid;gap:6px}
.nhip div{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--n,#eef8f4);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--mo)}
.nhip b{font-size:15.5px;color:var(--chu);font-variant-numeric:tabular-nums;white-space:nowrap}
.nhip b.am{color:var(--qua)}

/* Bieu do */
.cot{display:flex;align-items:flex-end;gap:2px;height:92px}
.cot i{flex:1;background:linear-gradient(180deg,var(--c2),var(--c1));border-radius:3px 3px 0 0;transform-origin:bottom}
.cot i.nay{background:linear-gradient(180deg,#ffb066,var(--cam))}
.trucngay{display:flex;justify-content:space-between;font-size:11px;color:var(--mo);margin-top:4px}
.vong{display:flex;justify-content:center;margin:0 0 14px}
.vongtron{width:150px;height:150px;border-radius:50%;display:grid;place-items:center}
.vongtron div{width:104px;height:104px;border-radius:50%;background:var(--the);display:grid;place-content:center;text-align:center;font-size:12px;color:var(--mo)}
.vongtron b{display:block;font-size:14.5px;color:var(--chu);font-variant-numeric:tabular-nums}

/* Hu */
.hu{display:flex;gap:11px;width:100%;text-align:left;padding:10px 0}
.oh{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--n)}
.hugiua{flex:1;min-width:0}
.huhang{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.huten{font-weight:650;min-width:0;overflow-wrap:anywhere}
.huso{font-size:13.5px;color:var(--mo);white-space:nowrap;font-variant-numeric:tabular-nums}
.vach{height:8px;border-radius:4px;background:var(--vien);margin-top:7px;overflow:hidden}
.vach i{display:block;height:100%;background:var(--m);border-radius:4px;transform-origin:left}
.vach i.canh{background:var(--canh)}.vach i.qua{background:var(--qua)}
.huphu{font-size:12.5px;color:var(--mo);margin-top:4px}
.huphu.qua{color:var(--qua);font-weight:650}

/* So */
.locs{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 10px;padding:2px 14px;scrollbar-width:none}
.locs::-webkit-scrollbar{display:none}
.loc{flex:none;padding:8px 14px;border-radius:20px;background:var(--the);font-size:14px;box-shadow:var(--bong)}
.loc.on{background:var(--c1);color:#fff;font-weight:650}
.ngay{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--mo);margin:14px 4px 6px}
.nhom{background:var(--the);border-radius:18px;overflow:hidden;box-shadow:var(--bong)}
.the .nhom{box-shadow:none;margin:-4px -4px 0}
.dong{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;text-align:left;min-height:62px;border-radius:0}
.dong+.dong{border-top:1px solid var(--vien)}
.dong:active{transform:none;background:var(--nen)}
.dong .giua{flex:1;min-width:0}
.dong .ten{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dong .phu{font-size:12.5px;color:var(--mo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dong .tien{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.trong{text-align:center;color:var(--mo);padding:30px 18px}
.trong span{display:block;font-size:44px;margin-bottom:6px}

/* Cac hu */
.hang{display:flex;align-items:center;gap:8px;padding:8px 0}
.hang input{min-width:0;height:46px;padding:0 10px;border:1.5px solid var(--vien);border-radius:12px;background:var(--the);font-size:16px}
.hang .i1{width:46px;flex:none;text-align:center;padding:0;background:var(--n);border-color:transparent;font-size:21px;border-radius:14px}
.hang .i2{flex:1.3;font-weight:600}
.hang .i3{flex:1;text-align:right;font-variant-numeric:tabular-nums}
.btn{height:48px;padding:0 18px;border-radius:14px;background:#e3f7ef;color:var(--c1);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.rong{width:100%}
.xoahu{width:34px;height:46px;flex:none;color:var(--mo);font-size:17px}
#ghichu{font-size:13px;color:var(--mo);margin:10px 0 0}
#fLink{width:100%;height:48px;padding:0 12px;border:1.5px solid var(--vien);border-radius:12px;background:var(--the);font-size:16px}

/* Thanh duoi */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--the);padding-bottom:env(safe-area-inset-bottom);border-radius:22px 22px 0 0;box-shadow:0 -6px 22px rgba(0,80,55,.1)}
.navtrong{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;height:66px}
.tab{height:66px;font-size:12px;font-weight:550;color:var(--mo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--c1);font-weight:700}
.tab.on svg{animation:nayIcon .35s var(--nhanh)}
#them{width:62px;height:62px;border-radius:50%;margin:-26px auto 0;background:linear-gradient(135deg,#ffa04d,var(--cam));color:#fff;font-size:34px;line-height:1;box-shadow:0 8px 18px rgba(255,122,26,.45)}

/* Man nhap khoan: tran man hinh, truot len. So tien o tren cung nen ban phim khong che */
dialog{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100dvh;max-height:100dvh;background:var(--nen);color:var(--chu);overflow:auto}
dialog[open]{animation:truotLen .3s var(--nhanh)}
dialog.dangdong{animation:truotXuong .2s ease-in forwards}
dialog::backdrop{background:rgba(0,40,30,.4)}
@media (min-width:600px){dialog{margin:auto;max-width:480px;height:auto;max-height:92dvh;border-radius:24px}}
.dauhop{background:linear-gradient(180deg,var(--c1),var(--c2));color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 20px;border-radius:0 0 26px 26px;transition:background .25s}
#fForm.thu .dauhop{background:linear-gradient(180deg,#5b21b6,var(--tim))}
#fForm.chi .dauhop{background:linear-gradient(180deg,#e8590c,#ff8f3f)}
.hanghop{display:flex;align-items:center;gap:6px}
.chon2{flex:1;display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.22);border-radius:14px;padding:3px}
.chon2 button{height:38px;border-radius:11px;font-weight:650;color:#fff}
.chon2 button.on{background:#fff;color:var(--chu)}
.luu{height:44px;padding:0 18px;border-radius:14px;background:#fff;color:var(--chu);font-weight:750}
.otien{display:flex;align-items:baseline;gap:6px;margin-top:12px;padding:0 6px}
#fTien{flex:1;min-width:0;height:58px;border:0;background:none;color:#fff;font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;caret-color:#fff}
#fTien::placeholder{color:rgba(255,255,255,.7)}
#fTien:focus{outline:0}
.otien span{font-size:20px;font-weight:700}
.thanhop{padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.nhanh{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.nhanh::-webkit-scrollbar{display:none}
.nhanh button{flex:none;height:38px;padding:0 13px;border-radius:12px;background:var(--the);font-size:14px;font-weight:550;font-variant-numeric:tabular-nums;box-shadow:var(--bong)}
.luoi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 12px}
.luoi button{min-height:82px;padding:8px 4px;border-radius:16px;background:var(--the);font-size:12.5px;font-weight:550;line-height:1.2;overflow-wrap:anywhere;border:2px solid transparent;box-shadow:var(--bong);display:flex;flex-direction:column;align-items:center;gap:5px}
.luoi button span{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--n)}
.luoi button.on{border-color:var(--m);font-weight:750;animation:nayIcon .3s var(--nhanh)}
.hai{display:grid;grid-template-columns:152px 1fr;gap:8px;margin-bottom:12px}
.hai input{width:100%;height:48px;padding:0 10px;border:1.5px solid var(--vien);border-radius:12px;background:var(--the);font-size:16px;min-width:0}
.btn.xoa{color:var(--qua);background:#fdecec}
#fXoa[hidden]{display:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;width:calc(100% - 28px);max-width:520px;background:#10261f;color:#fff;border-radius:16px;padding:7px 8px 7px 12px;display:flex;align-items:center;gap:10px;min-height:52px;font-size:14.5px;box-shadow:0 10px 24px rgba(0,40,30,.3);animation:toastLen .3s var(--nhanh)}
#toast[hidden]{display:none}
#toast .dau{flex:none;width:26px;height:26px;border-radius:50%;background:#22c58b;display:grid;place-items:center;font-style:normal;font-weight:800;animation:nay .4s var(--nhanh)}
#toast.loi .dau{background:#ff922b}
#toast span{flex:1}
#toast button{padding:8px 10px;font-weight:750;color:#7ff0c6}

/* Hieu ung: chi chay khi doi man hinh, dong bo ngam khong lam giat lai */
.hieuung>*{animation:vao .38s var(--nhanh) both}
.hieuung>:nth-child(2){animation-delay:.05s}
.hieuung>:nth-child(3){animation-delay:.1s}
.hieuung>:nth-child(4){animation-delay:.15s}
.hieuung>:nth-child(n+5){animation-delay:.2s}
.hieuung .vach i{animation:keoNgang .7s var(--nhanh) .15s both}
.hieuung .cot i{animation:keoDoc .55s var(--nhanh) .1s both}
.hieuung .vongtron{animation:quayVao .6s var(--nhanh) .1s both}
@keyframes vao{from{opacity:0;transform:translate(var(--dx,0),var(--dy,12px))}}
@keyframes keoNgang{from{transform:scaleX(0)}}
@keyframes keoDoc{from{transform:scaleY(0)}}
@keyframes quayVao{from{opacity:0;transform:rotate(-70deg) scale(.8)}}
@keyframes truotLen{from{transform:translateY(100%)}}
@keyframes truotXuong{to{transform:translateY(100%)}}
@keyframes toastLen{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes nay{0%{transform:scale(0)}70%{transform:scale(1.2)}}
@keyframes nayIcon{50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="dauthang">
    <button class="tron" data-lam="thangLui" aria-label="Tháng trước">‹</button>
    <h1 id="tieude"></h1>
    <button class="tron" data-lam="thangToi" aria-label="Tháng sau">›</button>
  </div>
  <button id="dongbo" data-lam="dongBoNgay"></button>
</header>
<main id="trang"></main>
<nav>
  <div class="navtrong">
    <button class="tab" data-tab="tq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Trang chủ</button>
    <button class="tab" data-tab="so"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h13v18H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 8h6M9 12h6"/></svg>Sổ</button>
    <button id="them" data-lam="themMoi" aria-label="Thêm khoản mới">+</button>
    <button class="tab" data-tab="hu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v3l2 3v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9l2-3zM6.5 13h11"/></svg>Các hũ</button>
    <button class="tab" data-tab="nam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 10h16M8 3v4M16 3v4"/></svg>Cả năm</button>
  </div>
</nav>

<dialog id="hop" aria-label="Thêm khoản">
  <form id="fForm" method="dialog" novalidate>
    <div class="dauhop">
      <div class="hanghop">
        <button type="button" class="tron" data-lam="dongHop" aria-label="Đóng">✕</button>
        <div class="chon2">
          <button type="button" data-loai="chi">Chi tiền</button>
          <button type="button" data-loai="thu">Tiền vào</button>
        </div>
        <button type="submit" class="luu">Lưu</button>
      </div>
      <div class="otien">
        <input id="fTien" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Số tiền">
        <span>đ</span>
      </div>
    </div>
    <div class="thanhop">
      <div class="nhanh" id="fNhanh"></div>
      <div class="luoi" id="fHu"></div>
      <div class="hai">
        <input id="fNgay" type="date" aria-label="Ngày">
        <input id="fGhi" maxlength="200" placeholder="Ghi chú" autocomplete="off" aria-label="Ghi chú">
      </div>
      <button type="button" class="btn xoa rong" id="fXoa" data-lam="xoaKhoan">Xoá khoản này</button>
    </div>
  </form>
</dialog>
<div id="toast" hidden role="status"></div>
<script src="tinh.js"></script>
<script src="app.js"></script>
</body>
</html>
